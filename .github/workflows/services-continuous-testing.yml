name: Microservices - Continuous Integration

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "munchora/backend/ai-service/**"
      - "munchora/backend/auth-service/**"
      - "munchora/backend/notifications-service/**"
      - "munchora/backend/recipes-service/**"
      - "munchora/backend/shopping-lists-service/**"
      - ".github/workflows/services-continuous-testing.yml"
  push:
    branches: [ "main" ]
    paths:
      - "munchora/backend/ai-service/**"
      - "munchora/backend/auth-service/**"
      - "munchora/backend/notifications-service/**"
      - "munchora/backend/recipes-service/**"
      - "munchora/backend/shopping-lists-service/**"
      - ".github/workflows/services-continuous-testing.yml"

jobs:
  # =======================================================================
  # JOB 1: LINTING (Runs in parallel for each service)
  # =======================================================================
  linting:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # Continue testing other services even if one fails
      matrix:
        service:
          - { name: 'ai', path: 'munchora/backend/ai-service' }
          - { name: 'auth', path: 'munchora/backend/auth-service' }
          - { name: 'notifications', path: 'munchora/backend/notifications-service' }
          - { name: 'recipes', path: 'munchora/backend/recipes-service' }
          - { name: 'shopping-lists', path: 'munchora/backend/shopping-lists-service' }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.2
          bundler-cache: true
          working-directory: ${{ matrix.service.path }}

      - name: Run RuboCop for ${{ matrix.service.name }}
        working-directory: ${{ matrix.service.path }}
        run: |
          bundle exec rubocop \
            --format json \
            --out rubocop-report.json \
            --fail-level error

      - name: Upload RuboCop Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rubocop-report-${{ matrix.service.name }}
          path: ${{ matrix.service.path }}/rubocop-report.json

  # =======================================================================
  # JOB 2: RSPEC TESTS (Runs in parallel for each service)
  # =======================================================================
  rspec-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: 'ai', path: 'munchora/backend/ai-service', db: 'ai_test', master_key_secret: 'AI_MASTER_KEY' }
          - { name: 'auth', path: 'munchora/backend/auth-service', db: 'auth_test', master_key_secret: 'AUTH_MASTER_KEY' }
          - { name: 'notifications', path: 'munchora/backend/notifications-service', master_key_secret: 'NOTIFICATIONS_MASTER_KEY' }
          - { name: 'recipes', path: 'munchora/backend/recipes-service', db: 'recipes_test', master_key_secret: 'RECIPES_MASTER_KEY' }
          - { name: 'shopping-lists', path: 'munchora/backend/shopping-lists-service', db: 'shopping_lists_test', master_key_secret: 'SHOPPING_LISTS_MASTER_KEY' }

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: admin
          MYSQL_USER: munchora
          MYSQL_PASSWORD: admin
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -padmin"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    #
    #      rabbitmq:
    #        image: rabbitmq:3-management-alpine
    #        env:
    #          RABBITMQ_DEFAULT_USER: guest
    #          RABBITMQ_DEFAULT_PASS: guest
    #        ports:
    #          - 5672:5672
    #          - 15672:15672
    #        options: >-
    #          --health-cmd="rabbitmq-diagnostics check_port_connectivity"
    #          --health-interval=10s
    #          --health-timeout=5s
    #          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rails Credentials for ${{ matrix.service.name }}
        working-directory: ${{ matrix.service.path }}
        run: |
          mkdir -p config
          echo "${{ secrets[matrix.service.master_key_secret] }}" > config/master.key


      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.2
          bundler-cache: true
          working-directory: ${{ matrix.service.path }}

      - name: Initialize MySQL databases
        if: ${{ matrix.service.name != 'notifications' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

          # wait for MySQL service
          for i in {1..30}; do
            mysql -h 127.0.0.1 -u root -padmin -e "SELECT 1" && break
            echo "Waiting for MySQL..."
            sleep 2
          done

          mysql -h 127.0.0.1 -P 3306 -u root -padmin <<EOF
          CREATE DATABASE IF NOT EXISTS ai_test;
          CREATE DATABASE IF NOT EXISTS auth_test;
          CREATE DATABASE IF NOT EXISTS shopping_lists_test;
          CREATE DATABASE IF NOT EXISTS recipes_test;

          GRANT ALL PRIVILEGES ON ai_test.* TO 'munchora'@'%';
          GRANT ALL PRIVILEGES ON auth_test.* TO 'munchora'@'%';
          GRANT ALL PRIVILEGES ON shopping_lists_test.* TO 'munchora'@'%';
          GRANT ALL PRIVILEGES ON recipes_test.* TO 'munchora'@'%';

          FLUSH PRIVILEGES;
          EOF

      - name: Setup Database
        if: ${{ matrix.service.name != 'notifications' }}
        working-directory: ${{ matrix.service.path }}
        env:
          RAILS_ENV: test
          DB_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: munchora
          MYSQL_PASSWORD: admin
        run: |
          bundle exec rails db:create db:migrate RAILS_ENV=test

      - name: Run RSpec Tests for ${{ matrix.service.name }}
        working-directory: ${{ matrix.service.path }}
        env:
          RAILS_ENV: test
          DB_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: munchora
          MYSQL_PASSWORD: admin
        run: bundle exec rspec

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service.name }}
          path: ${{ matrix.service.path }}/coverage/coverage.json

