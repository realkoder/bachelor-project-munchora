apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-app
  labels:
    app: frontend-app
    app.kubernetes.io/name: frontend-app
    app.kubernetes.io/part-of: munchora
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-app
  template:
    metadata:
      labels:
        app: frontend-app
    spec:
      containers:
        - name: frontend-app
          # Build this image locally: eval $(minikube docker-env) && docker build -t munchora-frontend -f Dockerfile.dev .
          image: munchora-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5173
              name: http
          env:
            # Node environment
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: frontend-config
                  key: NODE_ENV
            - name: VITE_ENV
              valueFrom:
                configMapKeyRef:
                  name: frontend-config
                  key: VITE_ENV

            # External API URL (accessed from browser)
            - name: VITE_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: frontend-config
                  key: VITE_BASE_URL

            # Internal API URL (accessed from SSR server)
            - name: VITE_BASE_URL_SSR
              valueFrom:
                configMapKeyRef:
                  name: frontend-config
                  key: VITE_BASE_URL_SSR

          livenessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              memory: '512Mi'
              cpu: '100m'
            limits:
              memory: '1Gi'
              cpu: '500m'
