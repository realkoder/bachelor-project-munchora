events {
    worker_connections 1024;
}

http {
    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # WebSocket connection timeout
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Upstreams for each service
    upstream ai_service {
        server ai:3000;
    }

    upstream auth_service {
        server auth:3000;
    }

    upstream notifications_service {
        server notifications:3000;
    }

    upstream recipes_service {
        server recipes:3000;
    }

    upstream shopping_lists_service {
        server shopping-lists:3000;
    }

    server {
        listen 80;
        server_name localhost;

        # Increase timeouts for development
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        send_timeout 300;

        # Auth service - preserve the /auth prefix
        location /auth {
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /auth;
            proxy_redirect off;
        }

         location /notifications/cable {
            proxy_pass http://notifications_service/cable;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket specific timeouts
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_connect_timeout 86400;

            # Disable buffering for WebSocket
            proxy_buffering off;
         }

         # Notifications service - preserve the /notifications prefix
        location /notifications {
            proxy_pass http://notifications_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /notifications;
            proxy_redirect off;
        }

        # Recipes service - preserve the /recipes prefix
        location /recipes {
            proxy_pass http://recipes_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /recipes;
            proxy_redirect off;
        }

        # Shopping service - preserve the /shopping-lists prefix
        location /shopping-lists {
            proxy_pass http://shopping_lists_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /shopping-lists;
            proxy_redirect off;
        }

        # AI service - preserve the /ai prefix
      location /ai/ {
            proxy_pass http://ai_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /ai;
            proxy_redirect off;
      }

        # Health check
        location /health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Root - return service map
        location = / {
            return 200 '{"services": ["/auth", "/recipes", "/shopping-lists", "/ai"]}\n';
            add_header Content-Type application/json;
        }
    }
}