    steps:
      - uses: actions/checkout@v4

      - name: Setup Rails Credentials for ${{ matrix.service.name }}
        working-directory: ${{ matrix.service.path }}
        run: |
          mkdir -p config
          echo "${{ secrets[matrix.service.master_key_secret] }}" > config/master.key
      

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.2
          bundler-cache: true
          working-directory: ${{ matrix.service.path }}

      - name: Setup Database
        working-directory: ${{ matrix.service.path }}
        env:
          RAILS_ENV: test
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: ${{ matrix.service.port }}
          MYSQL_USER: munchora
          MYSQL_PASSWORD: admin
        run: |
          bundle exec rails db:create db:migrate RAILS_ENV=test

      - name: Run RSpec Tests for ${{ matrix.service.name }}
        working-directory: ${{ matrix.service.path }}
        env:
          RAILS_ENV: test
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: ${{ matrix.service.port }}
          MYSQL_USER: munchora
          MYSQL_PASSWORD: admin
        run: bundle exec rspec

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service.name }}
          path: ${{ matrix.service.path }}/coverage/coverage.json

