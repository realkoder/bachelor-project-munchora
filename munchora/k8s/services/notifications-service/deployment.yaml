apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-service
  labels:
    app: notifications-service
    component: server
    app.kubernetes.io/name: notifications-service
    app.kubernetes.io/part-of: munchora
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifications-service
      component: server
  template:
    metadata:
      labels:
        app: notifications-service
        component: server
    spec:
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.35
          command:
            - sh
            - -c
            - |
              until nc -z rabbitmq-service 5672; do
                echo "Waiting for RabbitMQ..."
                sleep 2
              done
              echo "RabbitMQ is ready!"
      containers:
        - name: notifications-service
          # Build this image locally: eval $(minikube docker-env) && docker build -t munchora-notifications-service -f Dockerfile.dev .
          image: munchora-notifications-service:latest
          imagePullPolicy: Never
          command:
            - bash
            - -c
            - rm -f tmp/pids/server.pid && bundle exec rails s -b 0.0.0.0 -p 3000
          ports:
            - containerPort: 3000
              name: http
          env:
            # Rails configuration
            - name: RAILS_ENV
              valueFrom:
                configMapKeyRef:
                  name: munchora-config
                  key: RAILS_ENV
            - name: RAILS_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: munchora-config
                  key: RAILS_LOG_LEVEL
            - name: RAILS_RELATIVE_URL_ROOT
              valueFrom:
                configMapKeyRef:
                  name: notifications-service-config
                  key: RAILS_RELATIVE_URL_ROOT

            # RabbitMQ configuration
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: munchora-config
                  key: RABBITMQ_HOST
            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: munchora-config
                  key: RABBITMQ_PORT
            - name: RABBITMQ_USER
              valueFrom:
                configMapKeyRef:
                  name: munchora-config
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_PASSWORD

            # Rails master key
            - name: RAILS_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: notifications-service-master-key
                  key: RAILS_MASTER_KEY

            # Resend API key (optional, for email notifications)
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: resend-api
                  key: RESEND_API_KEY
                  optional: true

          livenessProbe:
            httpGet:
              path: /notifications/up
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /notifications/up
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              memory: '256Mi'
              cpu: '100m'
            limits:
              memory: '512Mi'
              cpu: '500m'
