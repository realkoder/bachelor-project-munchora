name: Microservices - Continuous Integration

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "munchora/backend/ai-service/**"
      - "munchora/backend/auth-service/**"
      - "munchora/backend/notifications-service/**"
      - "munchora/backend/recipes-service/**"
      - "munchora/backend/shopping-lists-service/**"
      - ".github/workflows/services-continuous-testing.yml"
  push:
    branches: [ "main" ]
    paths:
      - "munchora/backend/ai-service/**"
      - "munchora/backend/auth-service/**"
      - "munchora/backend/notifications-service/**"
      - "munchora/backend/recipes-service/**"
      - "munchora/backend/shopping-lists-service/**"
      - ".github/workflows/services-continuous-testing.yml"

jobs:
  # =======================================================================
  # JOB 1: LINTING (Runs in parallel for each service)
  # =======================================================================
  linting:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # Continue testing other services even if one fails
      matrix:
        service:
          - { name: 'ai', path: 'munchora/backend/ai-service' }
          - { name: 'auth', path: 'munchora/backend/auth-service' }
          - { name: 'notifications', path: 'munchora/backend/notifications-service' }
          - { name: 'recipes', path: 'munchora/backend/recipes-service' }
          - { name: 'shopping-lists', path: 'munchora/backend/shopping-lists-service' }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.2
          bundler-cache: true
          working-directory: ${{ matrix.service.path }}

      - name: Run RuboCop for ${{ matrix.service.name }}
        working-directory: ${{ matrix.service.path }}
        run: |
          bundle exec rubocop \
            --format json \
            --out rubocop-report.json \
            --fail-level error

      - name: Upload RuboCop Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rubocop-report-${{ matrix.service.name }}
          path: ${{ matrix.service.path }}/rubocop-report.json

  # =======================================================================
  # JOB 2: RSPEC TESTS (Runs in parallel for each service)
  # =======================================================================
  rspec-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: 'ai', path: 'munchora/backend/ai-service', db: 'ai_test', port: 3307, master_key_secret: 'AI_MASTER_KEY' }
          - { name: 'auth', path: 'munchora/backend/auth-service', db: 'auth_test', port: 3308, master_key_secret: 'AUTH_MASTER_KEY' }
          - { name: 'notifications', path: 'munchora/backend/notifications-service', db: 'notifications_test', port: 3311, master_key_secret: 'NOTIFICATIONS_MASTER_KEY' }
          - { name: 'recipes', path: 'munchora/backend/recipes-service', db: 'recipes_test', port: 3309, master_key_secret: 'RECIPES_MASTER_KEY' }
          - { name: 'shopping-lists', path: 'munchora/backend/shopping-lists-service', db: 'shopping_lists_test', port: 3310, master_key_secret: 'SHOPPING_LISTS_MASTER_KEY' }

