apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-rabbitmq-consumer
  labels:
    app: ai-service
    component: consumer
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/part-of: munchora
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
      component: consumer
  template:
    metadata:
      labels:
        app: ai-service
        component: consumer
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.35
          command:
            - sh
            - -c
            - |
              until nc -z ai-mysql-service 3306; do
                echo "Waiting for MySQL..."
                sleep 2
              done
              echo "MySQL is ready!"
        - name: wait-for-rabbitmq
          image: busybox:1.35
          command:
            - sh
            - -c
            - |
              until nc -z rabbitmq-service 5672; do
                echo "Waiting for RabbitMQ..."
                sleep 2
              done
              echo "RabbitMQ is ready!"
      containers:
        - name: ai-consumer
          image: munchora-ai-service:latest
          imagePullPolicy: Never
          command:
            - bundle
            - exec
            - ruby
            - bin/rabbitmq_consumer_runner.rb
          env:
            # Rails configuration
            - name: RAILS_ENV
              valueFrom:
                configMapKeyRef:
                  name: munchora-config
                  key: RAILS_ENV

            # Database configuration
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: ai-service-config
                  key: DB_HOST
            - name: MYSQL_PORT
              valueFrom:
                configMapKeyRef:
                  name: ai-service-config
                  key: MYSQL_PORT
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: ai-service-config
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: MYSQL_PASSWORD

            # RabbitMQ configuration
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: munchora-config
                  key: RABBITMQ_HOST
            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: munchora-config
                  key: RABBITMQ_PORT
            - name: RABBITMQ_USER
              valueFrom:
                configMapKeyRef:
                  name: munchora-config
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_PASSWORD

            # Rails master key
            - name: RAILS_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-service-master-key
                  key: RAILS_MASTER_KEY

            # OpenAI API credentials
            - name: OPENAI_API
              valueFrom:
                secretKeyRef:
                  name: openai-credentials
                  key: OPENAI_API

            # Upstash Redis URL
            - name: UPSTASH_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: upstash-redis
                  key: UPSTASH_REDIS_URL

          resources:
            requests:
              memory: '256Mi'
              cpu: '100m'
            limits:
              memory: '512Mi'
              cpu: '250m'
